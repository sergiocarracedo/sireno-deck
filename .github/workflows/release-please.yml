name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cli_web:
        description: CLI release (website continues deploying from main)
        type: boolean
        required: false
        default: false
      addon_app_shortcuts:
        description: App Shortcuts addon
        type: boolean
        required: false
        default: false
      addon_pomodoro:
        description: Pomodoro addon
        type: boolean
        required: false
        default: false
      theme_neon_grids:
        description: Neon Grids theme
        type: boolean
        required: false
        default: false
      theme_riptide:
        description: Riptide theme
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json
