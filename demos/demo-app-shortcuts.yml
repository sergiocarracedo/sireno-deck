name: App Shortcuts Demo
paginated: true
buttons:
  - position: 0
    type: "core:action"
    buttonColor: blue
    actions:
      tap: "code"
    config:
      icon: icon://code
      label: VS Code
  - position: 1
    type: "core:action"
    buttonColor: green
    actions:
      tap: "google-chrome"
    config:
      icon: icon://globe
      label: Chrome
  - position: 2
    type: "core:action"
    buttonColor: purple
    actions:
      tap: "slack"
    config:
      icon: icon://message-square
      label: Slack
  - position: 3
    type: "core:action"
    buttonColor: cyan
    actions:
      tap: "discord"
    config:
      icon: icon://message-circle
      label: Discord
  - position: 4
    type: "core:action"
    buttonColor: magenta
    actions:
      tap: "teams"
    config:
      icon: icon://users
      label: Teams
  - position: 5
    type: "core:action"
    buttonColor: amber
    actions:
      tap: "google-meet"
    config:
      icon: icon://video
      label: Google Meet
  - position: 6
    type: "core:action"
    buttonColor: lime
    actions:
      tap: "firefox"
    config:
      icon: icon://compass
      label: Firefox
