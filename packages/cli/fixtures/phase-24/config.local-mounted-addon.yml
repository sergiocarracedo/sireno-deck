addons:
  - name: phase-24-local-mounted-addon
    source: local
    path: ./local-mounted-addon
decks:
  main:
    id: main
    buttons:
      - position: 0
        type: phase-24-mounted-button
        label: Shared
      - position: 1
        type: phase-24-mounted-observer
        label: Observer
      - position: 2
        type: phase-24-mounted-button
        label: Go Apps
        target_deck: apps
  apps:
    id: apps
