name: release

on:
  push:
    tags:
      - "@sirenodeck/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    name: Detect packages in tag ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      package-path: ${{ steps.parse.outputs.package-path }}
      needs-build: ${{ steps.parse.outputs.needs-build }}
    steps:
      - id: parse
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Tag format: @sirenodeck/<component>-<version>
          # e.g. @sirenodeck/addon-pomodoro-0.1.0
          PACKAGE=''
          case "$TAG" in
            '@sirenodeck/sirenodeck-'*)
               PACKAGE='@sirenodeck/sirenodeck'
              PACKAGE_PATH='packages/cli'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/addon-app-shortcuts-'*)
               PACKAGE='@sirenodeck/addon-app-shortcuts'
              PACKAGE_PATH='packages/addons/app-shortcuts'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/addon-pomodoro-'*)
               PACKAGE='@sirenodeck/addon-pomodoro'
              PACKAGE_PATH='packages/addons/pomodoro'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/theme-neon-grids-'*)
               PACKAGE='@sirenodeck/theme-neon-grids'
              PACKAGE_PATH='packages/themes/neon-grids'
              NEEDS_BUILD='false'
              ;;
            '@sirenodeck/theme-riptide-'*)
               PACKAGE='@sirenodeck/theme-riptide'
              PACKAGE_PATH='packages/themes/riptide'
              NEEDS_BUILD='false'
              ;;
            *)
              echo "Unknown release tag: $TAG"
              exit 1
              ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package-path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "needs-build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.detect.outputs.package }}
    needs: detect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.detect.outputs.package-path }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: ${{ needs.detect.outputs.needs-build == 'true' }}
        run: pnpm run build

      - name: Determine version and dist-tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-alpha.* ]]; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-beta.* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: npm publish --provenance --tag "${{ steps.meta.outputs.dist_tag }}" --access public

      - name: Verify published package
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            PUBLISHED_VERSION=$(npm view "$PACKAGE@$VERSION" version)
            if [[ "$PUBLISHED_VERSION" == "$VERSION" ]]; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "expected npm version $VERSION, got $PUBLISHED_VERSION"
              exit 1
            fi
            sleep 5
          done
          PUBLISHED_TAG=$(npm view "$PACKAGE" "dist-tags.$DIST_TAG")
          if [[ "$PUBLISHED_TAG" != "$VERSION" ]]; then
            echo "expected npm $DIST_TAG tag $VERSION, got $PUBLISHED_TAG"
            exit 1
          fi
          npm view "$PACKAGE" dist-tags --json

  homebrew:
    name: Update Homebrew tap
    needs: [detect, publish]
    if: needs.detect.outputs.package == '@sirenodeck/sirenodeck'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Render formula
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#@sirenodeck/sirenodeck-}"
          URL="https://registry.npmjs.org/@sirenodeck/sirenodeck/-/sirenodeck-${VERSION}.tgz"
          SHA256=$(curl --fail --location "$URL" | sha256sum | cut -d' ' -f1)
          sed -e "s/VERSION/${VERSION}/g" -e "s/SHA256/${SHA256}/g" \
            packages/cli/scripts/installer/formula/sirenodeck.rb > sirenodeck.rb
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: sergiocarracedo/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish formula
        run: |
          mkdir -p homebrew-tap/Formula
          cp sirenodeck.rb homebrew-tap/Formula/sirenodeck.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/sirenodeck.rb
          git -C homebrew-tap diff --cached --quiet || git -C homebrew-tap commit -m "Update sirenodeck formula"
          git -C homebrew-tap push
