decks:
  main:
    id: main
    name: Main Deck
    buttons:
      - position: 8
        type: date-time
        format: 'HH:mm'

      - position: 9
        type: change-deck
        label: Emoji
        icon: addon://emoji-selector/favorites.svg
        target_deck: emoji

      - position: 10
        type: action
        label: Action
        commands:
          tap: 'google-chrome'
        icon: addon://emoji-selector/nature.svg

      - position: 0
        type: system-status-bars
        metrics:
          - metric: cpu_usage
            label: CPU
          - metric: memory_usage
            label: RAM
          - metric: swap_usage
            label: Swap
            unavailable_label: N/A

      - position: 5
        type: system-status-label-values
        metrics:
          - metric: cpu_usage
            label: CPU
            icon: sparkles
          - metric: fan_speed
            label: Fan
            unavailable_label: N/A
          - metric: uptime
            label: Uptime

      - position: 12
        type: media-player
        unavailable_label: Unavailable

      - position: 2
        type: time
        variant: big
      - position: 11
        type: time
      - position: 3
        type: date
      - position: 13
        type: clock

  emoji:
    id: emoji
    type: emoji-selector
    favorites:
      - 😀
      - 🔥
      - 🍕
    select_command: "printf '%s' '{{emoji}}'"
    buttons:
      - position: 0
        type: change-deck
        label: Main
        target_deck: main
addons:
  # Illustrative addon declarations ship disabled on purpose.
  # They do not load and will not emit startup warnings until you set
  # `enabled: true` and point them at a real local folder or installed npm addon.
  - name: local-clock-addon
    enabled: false
    source: local
    path: addons2/local-clock-addon2
  - name: '@sireno-deck/community-addon'
    enabled: false
    source: npm
logging:
  level: info
