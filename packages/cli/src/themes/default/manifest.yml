name: default
main: ./index.ts
version: 0.1.0
description: The default theme for Sireno Deck.
authors:
  - name: Sergio Carracedo
    email: hi@sergiocarracedo.es
assets:
  styles:
    - ./theme.css
colorTokens:
  background: '#2e3540'
  frame: '#53738B'
  foreground: '#eef2f7'
  primary: '#7dd3fc'
  accent: '#C3F5FF'
  success: '#34d399'
  danger: '#FFB4AB'
typography:
  main_text:
    font_family: 'IBM Plex Sans'
    font_size: 12
    font_weight: 100
  auxiliary_text:
    font_family: 'IBM Plex Sans'
    font_size: 8
    font_weight: 300
    letter_spacing: 1.2
  monospace:
    font_family: 'IBM Plex Mono'
    font_size: 10
    font_weight: 300
    letter_spacing: 0.4
