name: release

on:
  push:
    tags:
      - "@sirenodeck/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    name: Detect packages in tag ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      package-path: ${{ steps.parse.outputs.package-path }}
      needs-build: ${{ steps.parse.outputs.needs-build }}
    steps:
      - id: parse
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Tag format: @sirenodeck/<component>-<version>
          # e.g. @sirenodeck/addon-pomodoro-0.1.0
          PACKAGE=''
          case "$TAG" in
            '@sirenodeck/sirenodeck-'*)
               PACKAGE='@sirenodeck/sirenodeck'
              PACKAGE_PATH='packages/cli'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/addon-app-shortcuts-'*)
               PACKAGE='@sirenodeck/addon-app-shortcuts'
              PACKAGE_PATH='packages/addons/app-shortcuts'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/addon-pomodoro-'*)
               PACKAGE='@sirenodeck/addon-pomodoro'
              PACKAGE_PATH='packages/addons/pomodoro'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/theme-neon-grids-'*)
               PACKAGE='@sirenodeck/theme-neon-grids'
              PACKAGE_PATH='packages/themes/neon-grids'
              NEEDS_BUILD='false'
              ;;
            '@sirenodeck/theme-riptide-'*)
               PACKAGE='@sirenodeck/theme-riptide'
              PACKAGE_PATH='packages/themes/riptide'
              NEEDS_BUILD='false'
              ;;
            *)
              echo "Unknown release tag: $TAG"
              exit 1
              ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package-path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "needs-build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.detect.outputs.package }}
    needs: detect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.detect.outputs.package-path }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: ${{ needs.detect.outputs.needs-build == 'true' }}
        run: pnpm run build

      - name: Determine version and dist-tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-alpha.* ]]; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-beta.* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish and verify package
        env:
          PACKAGE: ${{ needs.detect.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          version_available() {
            [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]
          }

          # npm can accept a publish before its registry read API has indexed it.
          # Avoid republishing an already-published version when a release is retried.
          if ! version_available; then
            if ! npm publish --provenance --tag "$DIST_TAG" --access public; then
              echo "npm publish failed; checking whether the version was accepted already"
            fi
          else
            echo "$PACKAGE@$VERSION is already published; skipping publish"
          fi

          for attempt in {1..24}; do
            if version_available; then
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "npm did not make $PACKAGE@$VERSION available after 6 minutes"
              exit 1
            fi
            sleep 15
          done

          for attempt in {1..24}; do
            PUBLISHED_TAG=$(npm view "$PACKAGE" "dist-tags.$DIST_TAG" 2>/dev/null || true)
            if [[ "$PUBLISHED_TAG" == "$VERSION" ]]; then
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "expected npm $DIST_TAG tag $VERSION, got ${PUBLISHED_TAG:-<unavailable>}"
              exit 1
            fi
            sleep 15
          done
          npm view "$PACKAGE" dist-tags --json

  homebrew:
    name: Update Homebrew tap
    needs: detect
    if: needs.detect.outputs.package == '@sirenodeck/sirenodeck'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/cli
        run: pnpm install --frozen-lockfile
      - name: Build and pack CLI
        id: pack
        working-directory: packages/cli
        run: |
          pnpm run build
          ASSET_NAME=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          test -f "$ASSET_PATH"
          find dist -type f -printf 'package/dist/%P\n' | sort > "$RUNNER_TEMP/expected-dist-files.txt"
          tar -tzf "$ASSET_PATH" | grep '^package/dist/' | sort > "$RUNNER_TEMP/packed-dist-files.txt"
          diff -u "$RUNNER_TEMP/expected-dist-files.txt" "$RUNNER_TEMP/packed-dist-files.txt"
          echo "asset=$ASSET_PATH" >> "$GITHUB_OUTPUT"
      - name: Attach CLI tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ASSET_PATH: ${{ steps.pack.outputs.asset }}
        run: |
          ASSET_NAME=$(basename "$ASSET_PATH")
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET_NAME"; then
            echo "$ASSET_NAME is already attached to $RELEASE_TAG"
          else
            gh release upload "$RELEASE_TAG" "$ASSET_PATH"
          fi
      - name: Render formula
        working-directory: packages/cli
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ASSET_PATH: ${{ steps.pack.outputs.asset }}
        run: |
          ASSET_NAME=$(basename "$ASSET_PATH")
          TAG_PATH=$(python3 -c 'from urllib.parse import quote; import os; print(quote(os.environ["RELEASE_TAG"], safe=""))')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_PATH}/${ASSET_NAME}"
          SHA256=$(sha256sum "$ASSET_PATH" | cut -d' ' -f1)
          sed -e "s|RELEASE_URL|${URL}|g" -e "s/SHA256/${SHA256}/g" \
            packages/cli/scripts/installer/formula/sirenodeck.rb > sirenodeck.rb
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: sergiocarracedo/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish formula
        run: |
          mkdir -p homebrew-tap/Formula
          cp packages/cli/sirenodeck.rb homebrew-tap/Formula/sirenodeck.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/sirenodeck.rb
          git -C homebrew-tap diff --cached --quiet || git -C homebrew-tap commit -m "Update sirenodeck formula"
          git -C homebrew-tap push
