name: App Shortcuts Demo
trigger:
  process_name: ["__never_match_app_shortcuts__"]
buttons:
  - position: 0
    type: "core:action"
    buttonColor: blue
    actions:
      tap: "code"
    config:
      icon: icon://code
      label: VS Code
  - position: 1
    type: "core:action"
    buttonColor: green
    actions:
      tap: "google-chrome"
    config:
      icon: icon://globe
      label: Chrome
  - position: 2
    type: "core:action"
    buttonColor: purple
    actions:
      tap: "slack"
    config:
