theme: dark
main_deck: main
decks:
  main:
    id: main
    name: Main Deck
    buttons:
      - type: display
        position: 0
        label: Clock
      - type: action
        position: 1
        label: Ping
        command: printf 'pong'
      - type: change-deck
        position: 2
        label: Apps
        target_deck: apps
      - type: display
        icon: ./assets/shell.png
        label: Shell
        position: 3
      - type: display
        position: 13
        label: Sergio
  apps:
    id: apps
    name: Apps
    buttons:
      - type: display
        position: 0
        label: Terminal
      - type: action
        position: 1
        label: Date
        command: date +%H:%M
addons: []
logging:
  level: info
