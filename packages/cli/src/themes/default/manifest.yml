name: default
main: ./index.ts
version: 0.1.0
description: The default theme for Sireno Deck.
authors:
  - name: Sergio Carracedo
    email: hi@sergiocarracedo.es
assets:
  styles:
    - ./theme.css
colorTokens:
  background: '#2e3540'
  frame: '#53738B'
  foreground: '#eef2f7'
  foreground-contrast: '#000000'
  primary: '#7dd3fc'
  accent: '#C3F5FF'
  success: '#34d399'
  danger: '#FFB4AB'
typography:
  main_text:
    font-family: 'IBM Plex Sans'
    fontSize: 12
    font-weight: 100
  auxiliary_text:
    font-family: 'IBM Plex Sans'
    fontSize: 8
    font-weight: 300
    letter-spacing: 1.2
  monospace:
    font-family: 'IBM Plex Mono'
    fontSize: 10
    font-weight: 300
    letter-spacing: 0.4
