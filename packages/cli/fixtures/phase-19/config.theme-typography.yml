theme: default
main_deck: main
addons: []
decks:
  main:
    id: main
    buttons:
      - position: 0
        type: action
        label: Theme
        icon: builtin://core-buttons/clock.svg
      - position: 1
        type: analog-clock
      - position: 2
        type: calendar-sheet
      - position: 3
        type: change-deck
        label: Dark
        target_deck: dark-review
  dark-review:
    id: dark-review
    background: '#10161f'
    buttons:
      - position: 0
        type: action
        label: Review
        icon: builtin://core-buttons/clock.svg
      - position: 1
        type: analog-clock
      - position: 2
        type: calendar-sheet
      - position: 3
        type: change-deck
        label: Main
        target_deck: main
