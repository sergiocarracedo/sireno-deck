theme: dark
main_deck: main
decks:
  main:
    id: main
    name: Main Deck
    buttons:
      - position: 0
        type: builtin-display-text
        label: Clock
        icon: addon://core-buttons/clock.svg
      - position: 1
        type: builtin-change-deck
        label: Emoji
        icon: addon://emoji-selector/favorites.svg
        target_deck: emoji
  emoji:
    id: emoji
    type: emoji-selector
    favorites:
      - 😀
      - 🔥
      - 🍕
    select_command: "printf '%s' '{{emoji}}'"
addons:
  - name: local-clock-addon
    source: local
    path: addons/local-clock-addon
  - name: "@sireno-deck/community-addon"
    source: npm
logging:
  level: info
