name: System Status Demo
buttons:
  - position: 0
    type: "system-status:system-status"
    config:
      type: bars
      metrics: [cpu]
  - position: 1
    type: "system-status:system-status"
    config:
      type: bars
      metrics: [cpu, ram]
  - position: 2
    type: "system-status:system-status"
    config:
      type: bars
      metrics: [cpu, ram, swap]
  - position: 3
    type: "system-status:system-status"
    config:
      type: bars
      metrics: [disk, battery, temperature]
  - position: 4
    type: "system-status:system-status"
    config:
      type: kpis
      metrics: [disk-io, network-read, network-write]
  - position: 5
    type: "system-status:system-status"
    config:
      type: chart
      metrics: [cpu, ram]
      windowSeconds: 60
  - position: 6
    type: "system-status:system-status"
    config:
      type: kpis
      metrics: [gpu-temp]
  - position: 7
    type: "system-status:system-status"
    config:
      type: kpis
      metrics: [temperature, frequency]
  - position: 8
    type: "system-status:system-status"
    config:
      type: chart
      metrics: [load]
      windowSeconds: 30
  - position: 9
    type: "system-status:system-status"
    buttonColor: blue
    config:
      type: bars
      metrics: [cpu]
  - position: 10
    type: "system-status:system-status"
    buttonColor: green
    config:
      type: bars
      metrics: [ram]
  - position: 11
    type: "system-status:system-status"
    buttonColor: purple
    config:
      type: kpis
      metrics: [cpu]
  - position: 12
    type: "system-status:system-status"
    buttonColor: cyan
    config:
      type: chart
      metrics: [cpu]
      windowSeconds: 60
  - position: 13
    type: "system-status:system-status"
    buttonColor: magenta
    config:
      type: bars
      metrics: [temperature]
  - position: 14
    type: "system-status:system-status"
    buttonColor: amber
    config:
      type: kpis
      metrics: [disk-io]
  - position: 15
    type: "system-status:system-status"
    buttonColor: lime
    config:
      type: chart
      metrics: [load]
      windowSeconds: 30
