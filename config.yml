theme: dark
main_deck: main
decks:
  main:
    id: main
    name: Main Deck
    buttons:
      - position: 0
        type: builtin-display-text
        label: Clock
        icon: addon://core-buttons/clock.svg
      - position: 1
        type: builtin-change-deck
        label: Emoji
        icon: addon://emoji-selector/favorites.svg
        target_deck: emoji
      - position: 2
        type: local-clock
        label: Open Notepad
        icon: addon://core-buttons/app.svg
        
  emoji:
    id: emoji
    type: emoji-selector
    favorites:
      - 😀
      - 🔥
      - 🍕
    select_command: "printf '%s' '{{emoji}}'"
    buttons:
      - position: 0
        type: builtin-change-deck
        label: Main
        target_deck: main
addons:
  # Illustrative addon declarations ship disabled on purpose.
  # They do not load and will not emit startup warnings until you set
  # `enabled: true` and point them at a real local folder or installed npm addon.
  - name: local-clock-addon
    enabled: false
    source: local
    path: addons2/local-clock-addon2
  - name: "@sireno-deck/community-addon"
    enabled: false
    source: npm
logging:
  level: info
