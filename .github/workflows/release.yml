name: release

on:
  push:
    tags:
      - "@sirenodeck/*-*"

permissions:
  contents: read

jobs:
  detect:
    name: Detect packages in tag ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      package-path: ${{ steps.parse.outputs.package-path }}
      needs-build: ${{ steps.parse.outputs.needs-build }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag format: @sirenodeck/<component>-<version>
          # e.g. @sirenodeck/addon-pomodoro-0.1.0
          PACKAGE=''
          case "$TAG" in
            '@sirenodeck/cli-'*)
               PACKAGE='@sirenodeck/cli'
              PATH='packages/cli'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/addon-app-shortcuts-'*)
               PACKAGE='@sirenodeck/addon-app-shortcuts'
              PATH='packages/addons/app-shortcuts'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/addon-pomodoro-'*)
               PACKAGE='@sirenodeck/addon-pomodoro'
              PATH='packages/addons/pomodoro'
              NEEDS_BUILD='true'
              ;;
            '@sirenodeck/theme-neon-grids-'*)
               PACKAGE='@sirenodeck/theme-neon-grids'
              PATH='packages/themes/neon-grids'
              NEEDS_BUILD='false'
              ;;
            '@sirenodeck/theme-riptide-'*)
               PACKAGE='@sirenodeck/theme-riptide'
              PATH='packages/themes/riptide'
              NEEDS_BUILD='false'
              ;;
            *)
              echo "Unknown release tag: $TAG"
              exit 1
              ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package-path=$PATH" >> "$GITHUB_OUTPUT"
          echo "needs-build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.detect.outputs.package }}
    needs: detect
    uses: ./.github/workflows/publish-npm.yml
    with:
      package: ${{ needs.detect.outputs.package }}
      package-path: ${{ needs.detect.outputs.package-path }}
      needs-build: ${{ needs.detect.outputs.needs-build }}
    permissions:
      contents: read
      id-token: write

  homebrew:
    name: Update Homebrew tap
    needs: [detect, publish]
    if: needs.detect.outputs.package == '@sirenodeck/cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Render formula
        run: |
          VERSION="${GITHUB_REF_NAME##*-}"
          URL="https://registry.npmjs.org/@sirenodeck/cli/-/cli-${VERSION}.tgz"
          SHA256=$(curl --fail --location "$URL" | sha256sum | cut -d' ' -f1)
          sed -e "s/VERSION/${VERSION}/g" -e "s/SHA256/${SHA256}/g" \
            packages/cli/scripts/installer/formula/sirenodeck.rb > sirenodeck.rb
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: sergiocarracedo/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish formula
        run: |
          mkdir -p homebrew-tap/Formula
          cp sirenodeck.rb homebrew-tap/Formula/sirenodeck.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/sirenodeck.rb
          git -C homebrew-tap diff --cached --quiet || git -C homebrew-tap commit -m "Update sirenodeck formula"
          git -C homebrew-tap push
