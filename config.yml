decks:
  main:
    id: main
    name: Main Deck
    buttons:
      - position: 2
        type: time
        variant: big

      - position: 3
        type: date

      - position: 1
        type: action
        label: 'New tab'
        icon: 'icon://square-plus'

      - position: 4
        type: weather
        location:
          latitude: 42.2304
          longitude: -8.7256
          name: Vigo

      - position: 9
        type: emoji-selector

      - position: 10
        type: action
        label: Action
        commands:
          tap: 'google-chrome'
        icon: addon://emoji-selector/nature.svg

      - position: 0
        type: system-status
        variant: bars
        metrics:
          - metric: cpu_usage
            label: CPU
          - metric: memory_usage
            label: RAM
          - metric: swap_usage
            label: Swap
            unavailable_label: N/A

      - position: 5
        type: system-status
        metrics:
          - metric: cpu_usage
            label: CPU
            icon: sparkles
          - metric: fan_speed
            label: Fan
            unavailable_label: N/A
          - metric: uptime
            label: Uptime

      - position: 12
        type: media-player

      - position: 11
        type: time

      - position: 13
        type: clock

  emoji:
    id: emoji
    type: emoji-selector
    favorites:
      - 😀
      - 🔥
      - 🍕
    buttons:
      - position: 0
        type: change-deck
        label: Main
        target_deck: main
  chrome:
    id: chrome
    icon: /works/opensource/sireno-deck/assets/chrome.svg
    process_names:
      - chrome
    autoShow: true
    buttons:
      - position: 0
        type: action
        label: 'New tab'
        key_macro: 'ctrl+t'
        icon: 'icon://square-plus'
      - position: 1
        type: action
        label: 'Close tab'
        key_macro: 'ctrl+w'
        icon: 'icon://x'
      - position: 2
        type: action
        label: 'Unclose tab'
        key_macro: 'ctrl+shift+t'
        icon: 'icon://rotate-ccw'
      - position: 3
        type: action
        label: 'Incognito'
        key_macro: 'ctrl+shift+n'
        icon: 'icon://eye-off'
      - position: 4
        type: action
        label: 'Reload'
        key_macro: 'ctrl+r'
        icon: 'icon://rotate-cw'
      - position: 5
        type: action
        label: 'Hard reload'
        key_macro: 'ctrl+shift+r'
        icon: 'icon://refresh-cw'
      - position: 6
        type: action
        label: 'Dev tools'
        key_macro: 'F12'
        icon: 'icon://terminal'
addons:
  # Illustrative addon declarations ship disabled on purpose.
  # They do not load and will not emit startup warnings until you set
  # `enabled: true` and point them at a real local folder or installed npm addon.
  - name: local-clock-addon
    enabled: false
    source: local
    path: addons2/local-clock-addon2
  - name: '@sireno-deck/community-addon'
    enabled: false
    source: npm
logging:
  level: info
