name: Date/Time Demo
buttons:
  - position: 0
    type: "date-time:time"
    config:
      variant: big
  - position: 1
    type: "date-time:date"
  - position: 2
    type: "date-time:analog-clock"
  - position: 3
    type: "date-time:time"
  - position: 4
    type: "date-time:date-time"
    config:
      format: "DD/MM/YYYY HH:mm:ss"
  - position: 5
    type: "date-time:date-time"
    config:
      format: "HH:mm — ddd DD MMM"
  - position: 6
    type: "date-time:time"
    buttonColor: blue
    config:
      variant: big
  - position: 7
    type: "date-time:time"
    buttonColor: green
  - position: 8
    type: "date-time:date"
    buttonColor: purple
  - position: 9
    type: "date-time:date-time"
    buttonColor: cyan
    config:
      format: "DD/MM/YYYY HH:mm:ss"
  - position: 10
    type: "date-time:date-time"
    buttonColor: magenta
    config:
      format: "HH:mm — ddd DD MMM"
  - position: 11
    type: "date-time:time"
    buttonColor: amber
    config:
      variant: big
  - position: 12
    type: "date-time:date"
    buttonColor: lime
