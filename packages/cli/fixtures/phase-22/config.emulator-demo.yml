decks:
  main:
    id: main
    name: Emulator Demo
    buttons:
      - position: 0
        type: date-time
        format: <accent><xl>HH:mm</xl></accent>|*DD/MM* <blink><danger>ss</danger></blink>
      - position: 1
        type: change-deck
        label: Fallback
        target_deck: fallback
      - position: 2
        type: action
        label: Ping
        command: "printf 'pong'"

  fallback:
    id: fallback
    name: Invalid Markup Review
    buttons:
      - position: 0
        type: date-time
        format: Broken <accent><danger>HH:mm</accent></danger>|DD/MM/YYYY
      - position: 1
        type: change-deck
        label: Back
        target_deck: main

logging:
  level: info
main_deck: main
theme: dark
