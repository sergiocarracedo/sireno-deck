theme: dark
main_deck: main
decks:
  main:
    id: main
    name: Main Deck
    buttons:
      - type: display
        position: 0
        label: Clock
      - type: action
        position: 1
        label: Ping
        command: printf 'pong'
      - type: change-deck
        position: 2
        label: Apps
        target_deck: apps
      - type: toggle
        position: 3
        states:
          - key: muted
            label: Muted
            command: printf muted
          - key: active
            label: Active
            command: printf active
      - type: display
        position: 13
        label: Sergio
  apps:
    id: apps
    name: Apps
    buttons:
      - type: display
        position: 0
        label: Terminal
      - type: action
        position: 1
        label: Date
        command: date +%H:%M
      - type: toggle
        position: 2
        status_command: printf on
        interval_ms: 1000
        states:
          - key: off
            label: Pause
            command: printf pause
          - key: on
            label: Play
            command: printf play
addons: []
logging:
  level: info
