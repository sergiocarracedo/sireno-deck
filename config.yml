theme: default

addons:
  - src: /works/opensource/sireno-deck-addons/vscode-overlay
    config:
      decks:
        shortcuts:
          autoShow: false
          config:
            extra: true
  - /works/opensource/sireno-deck-addons/opencode-overlay
  - /works/opensource/sireno-deck-addons/chrome-overlay

# lock:
#   buttons:
#     - type: 'weather:weather'
#       config:
#         location:
#           latitude: 42.2304
#           longitude: -8.7256
#           name: Vigo

decks:
  main:
    name: Main Deck
    buttons:
      - position: 2
        type: 'date-time:time'
        config:
          variant: big

      - position: 3
        type: 'date-time:date'
        actions:
          tap: 'xdg-open https://calendar.google.com'

      - position: 1
        type: 'core:change-deck'
        config:
          deck: 'action-buttons-test'
          icon: 🧪
          label: Icon Test

      - position: 4
        type: 'weather:weather'
        config:
          location:
            latitude: 42.2304
            longitude: -8.7256
            name: Vigo

      - position: 9
        type: 'emoji-selector:launcher'

      - position: 10
        type: 'core:action'
        actions:
          tap: 'google-chrome'
          hold: 'google-chrome --incognito'
          dbltap: 'type://ctrl+t'
        config:
          icon: ./assets/chrome.svg
          label: Chrome

      - position: 0
        type: 'system-status:status'
        config:
          metric: cpu
          label: CPU

      - position: 5
        type: 'system-status:status'
        config:
          metric: ram
          label: RAM

      - position: 6
        type: 'media:volume:down'
      - position: 7
        type: 'media:volume:up'
      - position: 8
        type: 'media:mute'
      - position: 12
        type: 'media:player'

      - position: 11
        type: 'core:change-deck'
        config:
          deck: 'core:lock'
          icon: 'icon://lock'
          label: Lock deck

      - position: 13
        type: 'date-time:analog-clock'
        # actions:
        #   tap: 'google-chrome https://calendar.google.com'
  warp:
    trigger:
      process_name: warp
    name: Warp
    icon: icon://music
    buttons:
      - type: 'date-time:analog-clock'

logging:
  level: info
