theme: default

addons:
  - src: /works/opensource/sireno-deck-addons/vscode-overlay
  - /works/opensource/sireno-deck-addons/opencode-overlay
  - src: /works/opensource/sireno-deck-addons/chrome-overlay
    config:
      decks:
        shortcuts:
          autoShow: false
          config:
            extra: true

# lock:
#   buttons:
#     - type: 'weather:weather'
#       config:
#         location:
#           latitude: 42.2304
#           longitude: -8.7256
#           name: Vigo

decks:
  main:
    name: Main Deck
    buttons:
      - position: 2
        type: "date-time:time"
        config:
          variant: big

      - position: 3
        type: "date-time:date"
        actions:
          tap: "xdg-open https://calendar.google.com"

      - position: 1
        type: "core:change-deck"
        config:
          deck: "sys-status-demo"
          icon: 📊
          label: Sys Stats

      - position: 4
        type: "weather:weather"
        config:
          location:
            latitude: 42.2304
            longitude: -8.7256
            name: Vigo

      - position: 9
        type: "emoji-selector:launcher"

      - position: 10
        type: "core:action"
        actions:
          tap: "google-chrome"
          hold: "google-chrome --incognito"
          dbltap: "type://ctrl+t"
        config:
          icon: ./assets/chrome.svg
          label: Chrome

      - position: 0
        type: "system-status:kpis"
        config:
          metrics:
            - id: cpu
              label: CPU
            - id: ram
              label: MEM
            - swap

      - type: "system-status:system-status"
        config:
          metrics:
            - id: cpu
              label: CPU
            - id: ram
              label: MEM
            - swap

      - position: 6
        type: "media:volume:down"
      - position: 7
        type: "media:volume:up"
      - position: 8
        type: "media:mute"
      - position: 12
        type: "media:player"

      - position: 11
        type: "core:change-deck"
        config:
          deck: "core:lock"
          icon: "icon://lock"
          label: Lock deck

      - position: 13
        type: "date-time:analog-clock"
        # actions:
        #   tap: 'google-chrome https://calendar.google.com'
  sys-status-demo:
    name: Sys Stats
    buttons:
      - position: 0
        type: "system-status:system-status"
        config:
          metrics: [cpu]
      - position: 1
        type: "system-status:system-status"
        config:
          metrics: [cpu, ram]
      - position: 2
        type: "system-status:system-status"
        config:
          metrics:
            - id: cpu
              label: CPU
            - id: ram
              label: MEM
            - swap
      - position: 3
        type: "system-status:system-status"
        config:
          metrics:
            - id: disk
              label: Disk
            - id: battery
              label: Batt
            - id: temperature
              label: Temp
      - position: 4
        type: "system-status:system-status"
        config:
          metrics:
            - id: network
              label: Net
            - id: uptime
              label: Up
            - id: frequency
              label: Freq
      - position: 5
        type: "system-status:system-status"
        config:
          metrics:
            - id: load
              label: Load
            - id: processes
              label: Procs
      - position: 6
        type: "system-status:kpis"
        config:
          metrics: [cpu]
      - position: 7
        type: "system-status:kpis"
        config:
          metrics: [cpu, ram]
      - position: 8
        type: "system-status:kpis"
        config:
          metrics:
            - id: cpu
              label: CPU
            - id: ram
              label: MEM
            - swap
      - position: 9
        type: "system-status:kpis"
        config:
          metrics:
            - id: disk
              label: Disk
            - id: battery
              label: Batt
            - id: temperature
              label: Temp
      - position: 10
        type: "system-status:kpis"
        config:
          metrics:
            - id: network
              label: Net
            - id: uptime
              label: Up
            - id: frequency
              label: Freq
      - position: 11
        type: "system-status:kpis"
        config:
          metrics:
            - id: load
              label: Load
            - id: processes
              label: Procs
      - position: 12
        type: "core:change-deck"
        config:
          deck: main
          icon: ⬅
          label: Main
  warp:
    trigger:
      process_name: warp
    name: Warp
    icon: icon://music
    buttons:
      - type: "date-time:analog-clock"

logging:
  level: info
