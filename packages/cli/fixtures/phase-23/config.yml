decks:
  main:
    id: main
    name: Emulator Demo
    buttons:
      - position: 0
        type: date-time
        variant: time
      - position: 1
        type: phase-23-local-raw-button
        label: Emoji

  emoji:
    id: emoji
    type: emoji-selector
    favorites:
      - 😀
      - 🔥
      - 🍕
    select_command: "printf '%s' '{{emoji}}'"

addons:
  # Illustrative addon declarations ship disabled on purpose.
  # They do not load and will not emit startup warnings until you set
  # `enabled: true` and point them at a real local folder or installed npm addon.
  - name: phase-23-local-raw-addon
    enabled: true
    source: local
    path: ./local-raw-addon

logging:
  level: info
theme: dark
